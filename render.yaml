services:
  # Single unified web service – FastAPI serves the React SPA directly.
  # This eliminates all cross-origin / "Failed to fetch" issues.
  - type: web
    name: cityvision
    runtime: python
    plan: free
    region: oregon
    buildCommand: "npm --prefix frontend ci && npm --prefix frontend run build && pip install --upgrade pip && pip install -r backend/requirements.txt && pip uninstall -y opencv-python opencv-contrib-python || true && pip install --force-reinstall --no-deps opencv-python-headless"
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        value: sqlite:///./sih26124.db
